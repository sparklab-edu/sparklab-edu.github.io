<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>정보 수업 활동</title>
<!-- info-class 첫 화면 원본(배포: sparklab-edu/sparklab-edu.github.io 의 index.html). 수업 순서대로 한 줄씩. 새 차시는 LESSONS 배열에 한 줄 더한다 -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;700&display=swap">
<style>
  :root{--asph:#353a3f;--ink:#24282c;--sub:#5d646b;--line:#d5d8d3;--concrete:#ecedea;--paper:#fff;--zone:#ffc20e;--zone-soft:#fff4cf}
  *{box-sizing:border-box}
  body{margin:0;background:var(--concrete);color:var(--ink);font-family:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif}
  main{max-width:820px;margin:0 auto;padding:40px 16px 56px}
  .brand{font-weight:700;letter-spacing:.06em;color:var(--asph);font-size:15px}
  h1{font-size:30px;margin:6px 0 4px}
  .lead{color:var(--sub);margin:0 0 28px}
  h2{font-size:15px;color:var(--sub);margin:32px 0 10px;font-weight:700}
  ol.route{list-style:none;margin:0;padding:0}
  ol.route li{display:grid;grid-template-columns:44px 1fr;gap:0 14px;position:relative}
  /* 노선도: 번호 동그라미 + 이어지는 선 */
  ol.route li::before{content:"";position:absolute;left:21px;top:0;bottom:0;width:3px;background:var(--asph)}
  ol.route li:first-child::before{top:30px}ol.route li:last-child::before{bottom:calc(100% - 30px)}
  ol.route li.later::before{background:#b9beb8}
  .n{position:relative;z-index:1;width:44px;height:44px;margin-top:8px;border-radius:50%;background:var(--paper);border:3px solid var(--asph);display:grid;place-items:center;font-weight:700;font-size:17px}
  li.done .n{background:var(--asph);color:#fff}
  li.later .n{border-color:#b9beb8;color:#8d949a}
  .box{background:var(--paper);border-radius:6px;padding:16px 18px;margin-bottom:14px}
  .when{font-size:13px;color:var(--sub)}
  .t{font-size:20px;font-weight:700;margin:2px 0 4px}
  .d{font-size:14px;color:var(--sub);margin:0 0 12px}
  .links{display:flex;flex-wrap:wrap;gap:8px}
  .links a{display:inline-flex;align-items:center;height:40px;padding:0 14px;border-radius:5px;text-decoration:none;font-size:15px;font-weight:700}
  .links a.go{background:var(--asph);color:#fff}
  .links a.slide{background:var(--paper);color:var(--ink);border:1px solid #b9beb8}
  .links a.ex{color:var(--ink);text-decoration:underline;font-weight:400;padding:0 6px}
  li.later .t{color:#5d646b}
  .note{font-size:13px;color:var(--sub);margin-top:24px;line-height:1.6}
</style>
</head>
<body>
<main>
  <div class="brand">SPARK LAB</div>
  <h1>정보 수업 활동</h1>
  <p class="lead">1학년 2학기 · 별내 통학로를 지키는 작은 순찰 에이전트 · 위에서부터 차례로</p>

  <ol class="route" id="route"></ol>

  <p class="note"><b>활동 열기</b> = 수업 시간에 학생이 쓰는 화면 · <b>수업 슬라이드</b> = 선생님 화면(← → 넘기기) · <b>완성 예시</b> = 저장하지 않는 샘플(휴대폰에서도 열림)</p>
</main>
<script>
// [시작일, 끝일, 제목, 설명, 링크들] — 링크: [종류(go·slide·ex), 글자, 주소]
const LESSONS=[
  ['2026-10-12','2026-10-16','통학로 진단','공공데이터 4종을 열어 이상한 값을 거르고, 지도에 모아 순찰 지역 ★을 정해요.',[['go','활동 열기','route.html'],['ex','완성 예시','route.html#sample']]],
  ['2026-10-19','2026-10-23','표와 다이어그램','같은 데이터를 표 · 계층형 · 그래프형 · 막대 · 원으로 정리하고, 알맞은 방법을 골라요.',[['slide','수업 슬라이드','structure.html'],['slide','25분판','structure25.html']]],
  ['2026-10-19','2026-10-23','정지거리 측정','마퀸으로 멈추는 거리를 재서 그래프로 보고, 멈춤 기준 T를 정해요. 끝에 지도 앱 캡처 과제가 있어요.',[['go','활동 열기','stopping.html'],['ex','완성 예시','stopping.html#sample']]],
  ['2026-10-26','2026-10-30','AI 추천은 누구의 기준인가','내 길과 카카오맵 추천 길을 비교하고, 기준을 바꾸면 길이 어떻게 바뀌는지 봐요.',[['go','활동 열기','route.html#w11'],['ex','완성 예시','route.html#w11sample']]],
  ['2026-11-02','2026-11-06','찾은 오류 신고하기','1차시에 거른 공공데이터의 오류를 근거와 함께 신고 문장으로 써서, 고쳐 달라고 알려요.',[['go','활동 열기','route.html#report'],['ex','완성 예시','route.html#reportsample']]],
  ['2026-11-02','2026-11-06','AI가 짠 코드 · 인공지능 학습','바이브코딩과 CreateAI로 인공지능이 배우는 과정을 살펴봐요.',[]],
  ['2026-11-09','2026-11-13','순찰 로봇의 판단','학습한 모델을 마퀸에 넣고, 로봇이 어떻게 판단할지 정해요.',[]],
];
const today=new Date(new Date().toLocaleString('en-US',{timeZone:'Asia/Seoul'}));today.setHours(0,0,0,0);
const day=s=>{const d=new Date(s+'T00:00:00');return d;};
const fmt=(a,b)=>`${+a.slice(5,7)}/${+a.slice(8)} ~ ${+b.slice(5,7)}/${+b.slice(8)}`;
document.getElementById('route').innerHTML=LESSONS.map((l,i)=>{
  const [a,b,t,d,links]=l;
  const cls=today>day(b)?'done':links.length?'':'later';
  return `<li class="${cls}"><div class="n">${i+1}</div><div class="box"><div class="when">${fmt(a,b)}</div><div class="t">${t}</div><p class="d">${d}</p>${links.length?`<div class="links">${links.map(([k,s,h])=>`<a class="${k}" href="${h}">${s}</a>`).join('')}</div>`:'<p class="d" style="margin:0">준비 중</p>'}</div></li>`;}).join('');
</script>
</body>
</html>
